name: Daily Article Scraper

on:
  schedule:
    # 北京时间下午 15:10 执行 (UTC 07:10)
    - cron: '10 7 * * *'
  
  # 支持手动触发
  workflow_dispatch:
    inputs:
      max_pages:
        description: '最大爬取的feed页数 (0表示根据需要自动检测)'
        required: false
        default: '0'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    # 强制让所有 Javascript Actions 运行在 Node.js 24 环境，消除弃用警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 升级到 v5 以适配 Node.js 24
      - name: Checkout repository
        uses: actions/checkout@v5
      
      # 升级到 v6 以适配 Node.js 24
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run scraper
        env:
          # 数据库配置 (需在 GitHub 仓库 Settings -> Secrets -> Actions 中设置)
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          
          # MySQL SSL配置 (如果你的云数据库开启了强制SSL连接，请确保这些 Secret 已填入)
          DB_SSL_ENABLED: ${{ secrets.DB_SSL_ENABLED || 'false' }}
          DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
          DB_SSL_CERT: ${{ secrets.DB_SSL_CERT }}
          DB_SSL_KEY: ${{ secrets.DB_SSL_KEY }}
          
          # 爬虫配置 - 优先取手动输入的值，没有则默认为 '0'
          MAX_FEED_PAGES: ${{ github.event.inputs.max_pages || '0' }}
        run: |
          python scraper.py
